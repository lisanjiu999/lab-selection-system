server:
  port: 8080
  # 登录页的 WebGL 院徽是 2.4MB 的 three.js 打包产物，开 gzip 后约 600KB
  compression:
    enabled: true
    mime-types: application/javascript,text/javascript,text/css,application/json,text/html,image/svg+xml,text/plain
    min-response-size: 2048
spring:
  application:
    name: selection-system
  # 简历上传。Spring 默认单文件只给 1MB，5MB 的 PDF 会被静默挡在 413。
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:h2:mem:lab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false
  # 演示项目会反复重新打包，jar 内资源的 Last-Modified 是固定的构建时间，
  # 浏览器会据此「启发式缓存」到几乎永久，改完前端看不到变化。这里直接禁掉缓存。
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
          no-cache: true
logging:
  level:
    root: warn
    edu.lab.select: info
